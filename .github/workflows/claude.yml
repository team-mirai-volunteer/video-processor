name: Claude Code

# Claude Code を GitHub Actions 上で起動する workflow。
#
# 2つのトリガー経路を持つ:
#   1. @claude メンション経路:
#      issue / PR のコメントや本文に `@claude` と書かれると着火する。
#      （issue_comment / pull_request_review_comment / issues / pull_request_review）
#      この経路では action がコメント本文から prompt を自動で組み立てる。
#   2. repository_dispatch 経路（bot からの確実経路）:
#      type が `claude-task` の repository_dispatch POST で着火する。
#      みらいいぬ（GitHub App）など bot が token 認証で確実に着火させるための経路。
#      prompt は client_payload.prompt から渡す。
#
# ⚠️ 前提: repo（または org）secret に ANTHROPIC_API_KEY を投入しておく必要がある。
#         未投入だと action は認証に失敗する。

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  repository_dispatch:
    types: [claude-task]

jobs:
  claude:
    # @claude メンション、または repository_dispatch で着火する。
    # NOTE: bot 投稿者を弾く条件は意図的に入れていない。
    #       みらいいぬ（GitHub App）の @claude コメントを許可するため。
    if: |
      github.event_name == 'repository_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # repository_dispatch 経路では client_payload.prompt を prompt として渡す。
          # メンション経路では空になり、action がコメント本文から prompt を自動生成する。
          prompt: ${{ github.event.client_payload.prompt }}
